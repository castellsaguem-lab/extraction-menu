name: Build jam alert

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          build-root-directory: jam-alert

      - name: Build
        working-directory: jam-alert
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jam-alert
          path: jam-alert/build/libs/*.jar
