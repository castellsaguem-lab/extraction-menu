name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: rm -rf extraction-menu
      - run: unzip -q extraction-menu-sin-musica.zip
      - run: gradle build --no-daemon
        working-directory: extraction-menu
      - uses: actions/upload-artifact@v4
        with:
          name: extraction-menu
          path: extraction-menu/build/libs/*.jar
